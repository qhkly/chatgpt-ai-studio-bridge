# Regular pushes only run checks. They never publish a ZIP, never touch
# version.json, and never create a Release — releases come exclusively from
# pushing a v*.*.* tag (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
